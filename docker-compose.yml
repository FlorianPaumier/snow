name: snow

# Infrastructure-only compose: Postgres, Redis, Gotenberg and Mailpit as services,
# the Laravel app itself runs on the host (php artisan serve / composer run dev)
# and connects over the published ports (127.0.0.1:5432 / 127.0.0.1:6379 /
# 127.0.0.1:3000 / 127.0.0.1:2525 / 127.0.0.1:8026).
#
# Start:     docker compose up -d
# Stop:      docker compose down (-v to also drop db/redis data)

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: snow
            POSTGRES_USER: snow
            POSTGRES_PASSWORD: snow
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U snow -d snow']
            interval: 5s
            timeout: 5s
            retries: 10
        platform: linux/arm64

    redis:
        image: redis:8-alpine
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        platform: linux/arm64

    # HTML → PDF conversion for contract documents...
    gotenberg:
        image: gotenberg/gotenberg:8
        ports:
            - '127.0.0.1:3000:3000'
        platform: linux/arm64

    mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
            - '127.0.0.1:2525:1025'
            - '127.0.0.1:8026:8025'
        platform: linux/arm64

volumes:
    db-data:
