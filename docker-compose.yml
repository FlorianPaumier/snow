name: snow

# Infrastructure-only compose: Postgres, Redis and Gotenberg as services,
# the Laravel app itself runs on the host (php artisan serve / composer run dev)
# and connects over the published ports (127.0.0.1:5432 / 127.0.0.1:6379 /
# 127.0.0.1:3000).
#
# Start:     docker compose up -d
# Stop:      docker compose down (-v to also drop db/redis data)

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: snow
            POSTGRES_USER: snow
            POSTGRES_PASSWORD: snow
        ports:
            - '5432:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U snow -d snow']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    # HTML → PDF conversion for contract documents...
    gotenberg:
        image: gotenberg/gotenberg:8
        ports:
            - '3000:3000'

volumes:
    db-data:
