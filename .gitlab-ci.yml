# GitLab CI/CD for Frostline OPS (Laravel 13 / Inertia SSR / Pest 5 / Bun).
#
# Test-stage jobs split the project's `composer test` gate:
#   lint:    Pint + oxlint/oxfmt                     (strict)
#   rector:  Rector dry-run                          (allow_failure: 36 files of
#            pre-existing violations the dormant GH workflow never enforced)
#   types:   Pest type coverage + tsc                (strict)
#   phpstan: Larastan level max                      (strict)
#   tests:   full Pest suite incl. browser tests, run with TIA, excluding the
#            `visual` group (its PNG baselines were captured on macOS and are
#            pixel-incompatible with Linux renders)
#
# TODO: clear the rector debt, then drop its allow_failure flag.
#
# Then `deploy` triggers Laravel Cloud via its deploy hook (only on the
# default branch, only once LARAVEL_CLOUD_DEPLOY_HOOK is configured).
#
# Tests run against in-memory SQLite with array cache/session drivers
# (phpunit.xml pins them with force="true"), so no database service is needed.

workflow:
  rules:
    # Skip branch pipelines when an MR pipeline already covers the commit.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

variables:
  # Full history so Pest TIA can diff against the commit the dependency
  # graph was last recorded at (shallow clones would force graph rebuilds).
  GIT_DEPTH: "0"

.base:
  stage: test
  image: php:8.5
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - composer.lock
        - bun.lock
      prefix: "$CI_JOB_NAME"
    paths:
      - vendor/
      - node_modules/
  before_script:
    # System deps: unzip (composer dist zips + bun installer), libicu-dev
    # (ext-intl), git (required by Pest TIA's change detection).
    - apt-get update -yqq
    - apt-get install -yqq unzip libicu-dev git
    # PHP extensions beyond the php:8.5 image defaults: bcmath + sockets
    # (composer platform requirements), pcntl (paratest), intl
    # (Number::currency with fr-CA locale in payment mail).
    - docker-php-ext-install -j$(nproc) bcmath sockets pcntl intl
    # Node 24: the vp, tsc and playwright binaries are node scripts.
    - curl -sL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -yqq nodejs
    # Composer is not shipped in the official php image.
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # Bun (package manager; the lockfile is bun.lock).
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    # Cache dirs pinned by rector.php (FileCacheStorage) and phpstan.neon.
    - mkdir -p /tmp/rector /tmp/phpstan
    - echo 'zend.assertions=1' > /usr/local/etc/php/conf.d/zz-ci.ini
    - composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
    # App env for artisan + browser tests; phpunit.xml force-pins the test
    # environment (sqlite :memory:, array drivers) on top of this.
    - cp .env.example .env
    - php artisan key:generate
    # Wayfinder TS is gitignored (@/actions, @/routes imports) — regenerate
    # for tsc and the vite-plus type-aware linter. --with-form matches the
    # vite plugin's formVariants: true (tsc fails without .form variants).
    - php artisan wayfinder:generate --with-form
    - bun install --frozen-lockfile

lint:
  extends: .base
  script:
    # Pint + oxlint/oxfmt only — Rector moved to its own allow_failure job.
    - vendor/bin/pint --parallel --test
    - bun run test:lint

rector:
  # Pre-existing debt: 36 files would change. Tracked for a follow-up
  # cleanup; allow_failure keeps it visible (yellow) without blocking.
  extends: .base
  allow_failure: true
  script:
    - vendor/bin/rector --dry-run

types:
  extends: .base
  script:
    - composer test:type-coverage
    - bun run test:types

phpstan:
  extends: .base
  script:
    # The php:8.5 image ships memory_limit=128M — parallel PHPStan workers
    # crash there, so the limit is raised explicitly.
    - vendor/bin/phpstan --memory-limit=1G

tests:
  extends: .base
  variables:
    # Keep browser binaries inside the workspace so they ride the job cache.
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"
  cache:
    key:
      files:
        - composer.lock
        - bun.lock
      prefix: "$CI_JOB_NAME"
    paths:
      - vendor/
      - node_modules/
      - .playwright-browsers/
      - .pest-tia-home/
  before_script:
    - !reference [.base, before_script]
    # pcov: coverage driver for the 100% coverage gate and for TIA recording.
    - pecl install pcov
    - docker-php-ext-enable pcov
    # Pest browser tests use chromium only — add firefox/webkit here if a
    # test ever requests them.
    - bunx playwright install --with-deps chromium
    # Pest TIA stores its graph under $HOME/.pest/tia/<project-key>/; the
    # directory is not configurable in this Pest version, so HOME is pointed
    # inside the workspace to make it cacheable between pipeline runs.
    - mkdir -p .pest-tia-home
  script:
    # Browser tests serve assets from public/build, and the MarketingClaims
    # suite re-enables Inertia SSR — which requires the bootstrap/ssr bundle
    # (gitignored locally, hence never present in a fresh CI checkout).
    - bun run build:ssr
    # `composer test:unit` + --tia: cold cache runs the full suite while
    # recording the graph; warm cache re-runs only tests affected by the
    # commits since the recorded SHA and replays the rest (coverage gate
    # preserved). Fingerprints (composer.lock, phpunit.xml, bun.lock, PHP
    # version…) or an unreachable recorded SHA force a safe full rebuild.
    # The `visual` group is excluded: its PNG baselines were captured on
    # macOS Chromium and differ pixel-for-pixel from the Linux renders.
    - HOME="$CI_PROJECT_DIR/.pest-tia-home" XDEBUG_MODE="coverage" vendor/bin/pest --parallel --tia --coverage --exactly=100.0 --exclude-group=visual
  artifacts:
    when: on_failure
    paths:
      - tests/Browser/Screenshots
    expire_in: 7 days

deploy:laravel-cloud:
  stage: deploy
  image: curlimages/curl:latest
  interruptible: false
  timeout: 5 minutes
  # Serialize deploy triggers if several pipelines race.
  resource_group: production
  environment:
    name: production
  rules:
    # Default branch only, and only once the hook URL variable exists —
    # the job (and deploys) stay dormant until Laravel Cloud is wired up.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LARAVEL_CLOUD_DEPLOY_HOOK'
  script:
    # Trigger a Cloud deployment of the exact commit this pipeline tested.
    - curl -fsS --max-time 120 -X POST "$LARAVEL_CLOUD_DEPLOY_HOOK?commit_hash=$CI_COMMIT_SHA"
