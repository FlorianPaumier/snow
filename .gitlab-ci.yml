# GitLab CI/CD for Frostline OPS (Laravel 13 / Inertia SSR / Pest 5 / Bun).
#
# The toolchain (PHP 8.5 + extensions, pcov, Composer, Node 24, Bun,
# Chromium) is baked into $CI_REGISTRY_IMAGE/ci:latest — built and pushed
# BY HAND, not by a CI job (see the procedure in Dockerfile.ci and the
# .base template below). Jobs start ready to work and only pay for
# composer/bun installs from warm caches.
#
# Test-stage jobs split the project's `composer test` gate:
#   lint:    Pint + oxlint/oxfmt                     (strict)
#   rector:  Rector dry-run                          (allow_failure: 36 files of
#            pre-existing violations the dormant GH workflow never enforced)
#   types:   Pest type coverage + tsc                (strict)
#   phpstan: Larastan level max                      (strict)
#   unit:    isolated Pest unit suite (parallel, no coverage instrumentation)
#
# TODO: clear the rector debt, then drop its allow_failure flag.
#
# Then `deploy` triggers Laravel Cloud via its deploy hook (only on the
# default branch, only once LARAVEL_CLOUD_DEPLOY_HOOK is configured).
#
# Tests run against in-memory SQLite with array cache/session drivers
# (phpunit.xml pins them with force="true"), so no database service is needed.

workflow:
  rules:
    # Skip branch pipelines when an MR pipeline already covers the commit.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

variables:
  # Full history so Pest TIA can diff against the commit the dependency
  # graph was last recorded at (shallow clones would force graph rebuilds).
  GIT_DEPTH: "0"

# ---------------------------------------------------------------------------
# Test jobs
# ---------------------------------------------------------------------------

.base:
  stage: test
  # Baked toolchain (PHP 8.5 + extensions, pcov, Composer, Node 24, Bun,
  # Chromium) — see Dockerfile.ci. The image is NOT built by CI: build and
  # push it by hand after changing Dockerfile.ci (rootless builders like
  # buildah reject the recipe in several ways, and building in CI would
  # need the very image it produces):
  #
  #   docker login registry.gitlab.com
  #   docker build --platform linux/amd64 --file Dockerfile.ci \
  #     --tag registry.gitlab.com/florianpaumier1/snow/ci:latest .
  #   docker push registry.gitlab.com/florianpaumier1/snow/ci:latest
  #
  # --platform linux/amd64 matters: the runners are amd64 and an arm64
  # image (the default on an Apple Silicon Mac) fails every job.
  #
  # If this image is missing (first pipeline after introducing it, or a
  # deleted registry tag), jobs fail with a registry 404: build and push
  # it once with the commands above.
  image: $CI_REGISTRY_IMAGE/ci:latest
  interruptible: true
  timeout: 20 minutes
  variables:
    # Package download caches, kept inside the workspace so they ride the
    # job cache. The static key survives lockfile bumps: a dependency
    # change rebuilds vendor/node_modules from the lockfile-keyed cache
    # below, and the archives it needs to download ride this one.
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
    # NOTE: PLAYWRIGHT_BROWSERS_PATH is deliberately NOT set here. The CI
    # image bakes Chromium into /opt/ms-playwright, and setting the
    # variable would override that path and force a re-download. The
    # tests job scopes it to its fallback-download command only.
  cache:
    # Installed dependencies — the key rotates on every lockfile bump.
    - key:
        files:
          - composer.lock
          - bun.lock
        prefix: "$CI_JOB_NAME"
      paths:
        - vendor/
        - node_modules/
    # Downloaded package archives — static key, survives lockfile bumps.
    - key: "package-archives-v1"
      paths:
        - .composer-cache/
        - .bun-cache/
  before_script:
    # Dependencies first: artisan boots from vendor/autoload.php, so
    # key:generate and the Wayfinder regeneration cannot run before
    # composer install. The cache restore usually makes this a no-op.
    - composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
    - bun install --frozen-lockfile
    # App env for artisan + browser tests; phpunit.xml force-pins the test
    # environment (sqlite :memory:, array drivers) on top of this.
    - cp .env.example .env
    - php artisan key:generate
    # Wayfinder TS is gitignored (@/actions, @/routes imports) — regenerate
    # for tsc and the vite-plus type-aware linter. --with-form matches the
    # vite plugin's formVariants: true (tsc fails without .form variants).
    - php artisan wayfinder:generate --with-form

.php-base:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci:latest
  interruptible: true
  timeout: 10 minutes
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    - key:
        files:
          - composer.lock
        prefix: "$CI_JOB_NAME"
      paths:
        - vendor/
    - key: "composer-archives-v1"
      paths:
        - .composer-cache/
  before_script:
    - composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
    - cp .env.example .env
    - php artisan key:generate

lint:
  extends: .base
  # GitLab-hosted small amd64 runners provide 8 GB for the full lint process tree.
  tags:
    - saas-linux-small-amd64
  # The type-aware pass is the slowest step on shared runners; headroom
  # above .base's 20-minute ceiling so a slow run fails loudly instead of
  # being killed mid-flight with no output.
  timeout: 30 minutes
  script:
    # Pint + oxlint/oxfmt only — Rector moved to its own allow_failure job.
    - vendor/bin/pint --parallel --test
    # Let Go size its heap for the 8 GB runner; a low cap can stall type analysis.
    - GOMAXPROCS=2 bun run test:lint

rector:
  # Pre-existing debt: 36 files would change. Tracked for a follow-up
  # cleanup; allow_failure keeps it visible (yellow) without blocking.
  extends: .base
  allow_failure: true
  script:
    - vendor/bin/rector --dry-run

types:
  extends: .base
  script:
    - composer test:type-coverage
    - bun run test:types

phpstan:
  extends: .base
  script:
    # The php:8.5 image ships memory_limit=128M — parallel PHPStan workers
    # crash there, so the limit is raised explicitly.
    - vendor/bin/phpstan --memory-limit=1G

unit:
  extends: .base
  script:
    # Marketing claims are scanned from real server-rendered HTML. Always
    # build the current SSR bundle so a stale artifact cannot hide failures.
    - bun run build:ssr
    - php artisan test --compact --parallel --testsuite=Unit,Feature --coverage --min=99

browser:
  extends: .base
  script:
    - bun run build
    - rm -rf /var/lib/apt/lists/*
    - bunx playwright install --with-deps chromium
    - php artisan test --compact --testsuite=Browser --exclude-group=visual

deploy:laravel-cloud:
  stage: deploy
  # Pinned: the deploy hook must not silently change behavior when a new
  # curl major lands on :latest. Bump deliberately after checking the image.
  image: curlimages/curl:8.22.0
  interruptible: false
  timeout: 5 minutes
  # Serialize deploy triggers if several pipelines race.
  resource_group: production
  environment:
    name: production
  rules:
    # Default branch only, and only once the hook URL variable exists —
    # the job (and deploys) stay dormant until Laravel Cloud is wired up.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $LARAVEL_CLOUD_DEPLOY_HOOK'
  script:
    # Trigger a Cloud deployment of the exact commit this pipeline tested.
    - curl -fsS --max-time 120 -X POST "$LARAVEL_CLOUD_DEPLOY_HOOK?commit_hash=$CI_COMMIT_SHA"
